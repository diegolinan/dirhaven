name: Dirhaven Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Go tests - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Go from go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Show Go version
        run: go version
      - name: Run all Go tests
        run: go test -timeout=120s ./...
      - name: Run race tests (Linux and macOS)
        if: runner.os != 'Windows'
        run: go test -race -timeout=120s ./...
      - name: Vet
        run: go vet ./...
      - name: Build standalone CLI
        run: go build ./cmd/dirhaven

      - name: Install Node for frontend checks (Linux)
        if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install browser development dependencies (Linux)
        if: runner.os == 'Linux'
        run: npm ci --ignore-scripts
      - name: Check frontend JavaScript (Linux)
        if: runner.os == 'Linux'
        run: |
          node --check internal/setupwizard/web/app.js
          node --check internal/setupwizard/web/setup-view.js
      - name: Install test browser (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Run guided setup UI regressions (Linux)
        if: runner.os == 'Linux'
        run: npm run test:ui -- --project=desktop --project=mobile