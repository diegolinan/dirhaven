name: Dirhaven Windows installer preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/installer-windows.yml'
      - 'installers/windows/**'
      - 'assets/dirhaven-installer.ico'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'LICENSE'
      - 'NOTICE'
      - 'README.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'third_party/**'

permissions:
  contents: read

jobs:
  installer:
    name: Build per-user Windows x64 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate source and build Windows executable
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go vet failed' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          go build -trimpath -o dist/dirhaven-windows-amd64.exe ./cmd/dirhaven
          if ($LASTEXITCODE -ne 0) { throw 'Dirhaven build failed' }
          $fontFiles = @(Get-ChildItem -Path internal/setupwizard/web -Recurse -File -Filter '*.woff2')
          if ($fontFiles.Count -ne 0) { throw 'Licensed font binaries unexpectedly present in public build' }
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install Inno Setup compiler' }
      - name: Compile Dirhaven Setup
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $compiler = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) { throw 'ISCC.exe unavailable' }
          & $compiler 'installers/windows/Dirhaven.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          $package = 'dist/installer/Dirhaven-Setup-0.2.0-dev-windows-x64.exe'
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) { throw 'Installer artifact missing' }
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText('dist/installer/SHA256SUMS.txt', "$digest  Dirhaven-Setup-0.2.0-dev-windows-x64.exe`n", $utf8)
          Write-Output "Installer SHA256: $digest"
      - name: Acceptance test - install, shortcuts and uninstall on ephemeral runner
        shell: pwsh
        run: |
          ./installers/windows/test-install.ps1 -Installer 'dist/installer/Dirhaven-Setup-0.2.0-dev-windows-x64.exe' -SandboxDir (Join-Path $env:RUNNER_TEMP 'dirhaven-ci-acceptance')
      - name: Upload private preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: dirhaven-windows-installer-preview
          path: |
            dist/installer/Dirhaven-Setup-0.2.0-dev-windows-x64.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
