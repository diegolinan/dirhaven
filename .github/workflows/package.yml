name: Dirhaven manual release packaging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build, bundle license notices and calculate SHA-256
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $name = "dirhaven-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          $path = Join-Path dist $name
          go build -trimpath -o $path ./cmd/dirhaven
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE, NOTICE, README.md, SECURITY.md, CONTRIBUTING.md -Destination dist
          Copy-Item third_party/README.md -Destination dist/THIRD_PARTY_README.md
          New-Item -ItemType Directory -Path dist/third_party -Force | Out-Null
          Copy-Item third_party/licenses -Destination dist/third_party -Recurse
          $digest = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("$path.sha256", "$digest  $name`n", $utf8)
          if ((Get-ChildItem dist/third_party/licenses -Filter '*.LICENSE' -File).Count -ne 15) { throw 'Missing third-party module license copies' }
      - name: Upload unpublished package
        uses: actions/upload-artifact@v4
        with:
          name: dirhaven-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/**
          if-no-files-found: error
